<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prompt Review Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            animation-delay: -5s;
        }

        .particle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 70%;
            animation-delay: -10s;
        }

        .particle:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 30%;
            right: 40%;
            animation-delay: -7s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.1;
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
                opacity: 0.3;
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
                opacity: 0.2;
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
                opacity: 0.1;
            }
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            position: relative;
            z-index: 1;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpFadeIn 0.8s ease forwards;
            margin: 20px auto;
        }

        @keyframes slideUpFadeIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .brand-logo {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }
        
        .login-header h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
            transform: translateY(-10px);
            opacity: 0;
            animation: titleSlideDown 0.6s ease 0.3s forwards;
        }

        .login-header p {
            color: #a0a0b8;
            font-size: 1rem;
            opacity: 0;
            animation: titleSlideDown 0.6s ease 0.5s forwards;
        }

        @keyframes titleSlideDown {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .input-group {
            margin-bottom: 25px;
            position: relative;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInRight 0.5s ease forwards;
        }
        
        .input-group:nth-child(1) { animation-delay: 0.6s; }
        .input-group:nth-child(2) { animation-delay: 0.7s; }
        
        @keyframes slideInRight {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .input-group input::placeholder {
            color: #8a8aa0;
        }
        
        .input-group .error {
            color: #ff453a;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            transform: translateY(-5px);
            opacity: 0;
            transition: all 0.3s;
        }
        
        .input-group.error input {
            border-color: #ff453a;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        
        .input-group.error .error {
            display: block;
            transform: translateY(0);
            opacity: 1;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInRight 0.5s ease 0.8s forwards;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            color: #a0a0b8;
        }
        
        .remember-me input {
            margin-right: 8px;
            accent-color: #00d4ff;
        }
        
        .forgot-password {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .forgot-password:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInRight 0.5s ease 0.9s forwards;
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-button .btn-loader {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin-right: 10px;
        }

        .login-button.loading .btn-loader {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .login-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.4);
        }
        
        .login-button:hover::before {
            left: 100%;
        }
        
        .login-button:active {
            transform: translateY(-1px);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            position: relative;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInRight 0.5s ease 1s forwards;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .divider span {
            padding: 0 20px;
            color: #a0a0b8;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .google-button {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInRight 0.5s ease 1.1s forwards;
        }

        .google-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .google-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .google-button i {
            margin-right: 12px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #DB4437, #0F9D58, #F4B400, #DB4437);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #a0a0b8;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInRight 0.5s ease 1.2s forwards;
        }
        
        .signup-link a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: all 0.3s;
        }
        
        .signup-link a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            transition: width 0.3s;
        }
        
        .signup-link a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .signup-link a:hover::after {
            width: 100%;
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #a0a0b8;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            z-index: 2;
        }

        .back-home:hover {
            color: #00d4ff;
            transform: translateX(-5px);
        }

        /* Success/Error Messages */
        .message {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            transform: translateX(150%);
            transition: transform 0.5s ease;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .message.success {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
        }

        .message.error {
            background: linear-gradient(135deg, #ff453a, #cc3629);
        }

        .message.show {
            transform: translateX(0);
        }
        
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 10px;
            }
            
            .login-container {
                padding: 40px 30px;
                margin: 20px auto;
                max-width: 100%;
            }

            .back-home {
                top: 20px;
                left: 20px;
                position: fixed;
            }

            .message {
                top: 20px;
                right: 20px;
                left: 20px;
                transform: translateY(-150%);
            }

            .message.show {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Back to Home
    </a>

    <div class="login-container">
        <div class="login-header">
            <div class="brand-logo">⚡</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                <div class="error" id="emailError">Please enter a valid email address</div>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <div class="error" id="passwordError">Password must be at least 6 characters</div>
            </div>
            
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
            </div>
            
            <button type="submit" class="login-button">
                <span class="btn-loader"></span>
                <span class="btn-text">Sign In</span>
            </button>
            
            <div class="divider">
                <span>Or continue with</span>
            </div>
            
            <button type="button" class="google-button" id="googleSignIn">
                <i class="fab fa-google"></i>
                <span>Continue with Google</span>
            </button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <div class="message success" id="successMessage">
        <i class="fas fa-check-circle"></i> Login successful!
    </div>

    <div class="message error" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i> <span id="errorText">Login failed!</span>
    </div>

    <script type="module">
        import { auth, googleProvider } from './firebase-config.js';
        import { signInWithEmailAndPassword, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const loginForm = document.getElementById('loginForm');
        const googleSignInBtn = document.getElementById('googleSignIn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Show message function
        function showMessage(type, message) {
            const messageEl = type === 'success' ? successMessage : errorMessage;
            if (type === 'error') {
                errorText.textContent = message;
            }
            messageEl.classList.add('show');
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 4000);
        }

        // Check if user is already logged in
        window.addEventListener('load', () => {
            const userData = localStorage.getItem('user');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    if (user.uid) {
                        showMessage('success', 'Already logged in, redirecting...');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                        return;
                    }
                } catch (error) {
                    localStorage.removeItem('user');
                }
            }
        });

        // Email/Password Login
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginButton = document.querySelector('.login-button');
            
            // Reset error states
            document.querySelectorAll('.input-group').forEach(group => {
                group.classList.remove('error');
            });
            
            let isValid = true;
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('email').parentElement.classList.add('error');
                isValid = false;
            }
            
            // Validate password
            if (password.length < 6) {
                document.getElementById('password').parentElement.classList.add('error');
                isValid = false;
            }
            
            if (!isValid) return;

            // Show loading state
            loginButton.classList.add('loading');
            loginButton.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                showMessage('success', 'Login successful!');
                
                // Store user info in localStorage
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName
                }));
                
                // Redirect to main app after delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                
            } catch (error) {
                console.error('Login error:', error);
                let errorMsg = 'Login failed. Please try again.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMsg = 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        errorMsg = 'Incorrect password.';
                        break;
                    case 'auth/invalid-email':
                        errorMsg = 'Invalid email address.';
                        break;
                    case 'auth/too-many-requests':
                        errorMsg = 'Too many failed attempts. Please try again later.';
                        break;
                    case 'auth/invalid-credential':
                        errorMsg = 'Invalid email or password.';
                        break;
                    case 'auth/network-request-failed':
                        errorMsg = 'Network error. Please check your connection.';
                        break;
                }
                
                showMessage('error', errorMsg);
            } finally {
                loginButton.classList.remove('loading');
                loginButton.disabled = false;
            }
        });

        // Google Sign-In
        googleSignInBtn.addEventListener('click', async function() {
           console.log('Google sign-in button clicked');
            this.disabled = true;
            const originalHTML = this.innerHTML;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                console.log('Starting Google sign-in process');
                
                // Check if auth is properly initialized
                if (!auth) {
                    throw new Error('Firebase Auth not initialized');
                }
                
                if (!googleProvider) {
                    throw new Error('Google Provider not initialized');
                }
                
                const result = await signInWithPopup(auth, googleProvider);
                console.log('Google sign-in successful:', result);
                const user = result.user;
                
                showMessage('success', 'Google login successful!');
                
                // Store user info in localStorage
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName,
                    photoURL: user.photoURL
                }));
                
                // Redirect to main app after delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                
            } catch (error) {
                console.error('Google sign-in error:', error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                
                let errorMsg = 'Google sign-in failed. Please try again.';
                
                switch (error.code) {
                    case 'auth/popup-closed-by-user':
                        errorMsg = 'Sign-in cancelled.';
                        break;
                    case 'auth/popup-blocked':
                        errorMsg = 'Popup blocked. Please allow popups and try again.';
                        break;
                    case 'auth/cancelled-popup-request':
                        errorMsg = 'Only one popup request is allowed at a time.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMsg = 'Google sign-in is not enabled for this project.';
                        break;
                    case 'auth/unauthorized-domain':
                        errorMsg = 'This domain is not authorized for Google sign-in.';
                        break;
                    case 'auth/network-request-failed':
                        errorMsg = 'Network error. Please check your connection.';
                        break;
                    case 'auth/internal-error':
                        errorMsg = 'Internal error. Please try again later.';
                        break;
                    case 'auth/configuration-not-found':
                        errorMsg = 'Firebase configuration error. Please contact support.';
                        break;
                    case 'auth/invalid-api-key':
                        errorMsg = 'Invalid API key. Please contact support.';
                        break;
                    default:
                        errorMsg = `Authentication error (${error.code}): ${error.message}`;
                }
                
                showMessage('error', errorMsg);
            } finally {
                this.disabled = false;
                this.innerHTML = originalHTML;
            }
        });

        // Real-time validation
        document.getElementById('email').addEventListener('blur', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(this.value.trim())) {
                this.parentElement.classList.add('error');
            } else {
                this.parentElement.classList.remove('error');
            }
        });
        
        document.getElementById('password').addEventListener('blur', function() {
            if (this.value.length < 6) {
                this.parentElement.classList.add('error');
            } else {
                this.parentElement.classList.remove('error');
            }
        });

        // Handle auth state changes
        // Handle auth state changes with error handling
        try {
            auth.onAuthStateChanged((user) => {
                console.log('Auth state changed:', user ? 'User logged in' : 'User logged out');
                if (user && !window.location.href.includes('index.html')) {
                    // User is signed in, redirect to main app
                    localStorage.setItem('user', JSON.stringify({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        photoURL: user.photoURL
                    }));
                    window.location.href = 'index.html';
                }
            });
        } catch (error) {
            console.error('Auth state listener error:', error);
        }
        
        // Debug: Log Firebase initialization status
        console.log('Firebase Auth initialized:', !!auth);
        console.log('Google Provider initialized:', !!googleProvider);
        console.log('Current URL:', window.location.href);
    </script>
</body>
</html>
